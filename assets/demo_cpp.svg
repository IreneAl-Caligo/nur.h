<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-cpp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <filter id="shadow-cpp" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes typing-code-cpp {
      0%, 100% { opacity: 0; }
      8%, 98% { opacity: 1; }
    }
    @keyframes typing-cmd2-cpp {
      0%, 28% { opacity: 0; }
      32%, 98% { opacity: 1; }
    }
    @keyframes compile-output-cpp {
      0%, 46% { opacity: 0; }
      48%, 98% { opacity: 1; }
    }
    @keyframes typing-cmd3-cpp {
      0%, 56% { opacity: 0; }
      60%, 98% { opacity: 1; }
    }
    @keyframes exec-output-cpp {
      0%, 70% { opacity: 0; }
      72%, 98% { opacity: 1; }
    }
    @keyframes cursor-blink-cpp {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    .term-text {
      font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace;
      font-size: 13.5px;
      line-height: 22px;
    }
    .prompt { fill: #58a6ff; font-weight: bold; }
    .cmd { fill: #f0f6fc; }
    .keyword { fill: #ff7b72; font-weight: bold; }
    .type { fill: #ffa657; }
    .func { fill: #d2a8ff; }
    .str { fill: #a5d6ff; }
    .comment { fill: #8b949e; font-style: italic; }
    .success { fill: #3fb950; font-weight: bold; }
    .metric { fill: #e3b341; font-weight: bold; }
    .cursor { fill: #58a6ff; animation: cursor-blink-cpp 0.8s infinite; }

    .anim-code { animation: typing-code-cpp 6s infinite; }
    .anim-cmd2 { animation: typing-cmd2-cpp 6s infinite; }
    .anim-compile { animation: compile-output-cpp 6s infinite; }
    .anim-cmd3 { animation: typing-cmd3-cpp 6s infinite; }
    .anim-exec { animation: exec-output-cpp 6s infinite; }
  </style>

  <!-- Container -->
  <rect x="20" y="16" width="840" height="318" rx="12" fill="url(#bg-grad-cpp)" stroke="#30363d" stroke-width="1.5" filter="url(#shadow-cpp)"/>

  <!-- Title Bar -->
  <path d="M 20 28 Q 20 16 32 16 L 848 16 Q 860 16 860 28 L 860 52 L 20 52 Z" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <line x1="20" y1="52" x2="860" y2="52" stroke="#30363d" stroke-width="1"/>

  <!-- Traffic Lights -->
  <circle cx="44" cy="34" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="64" cy="34" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="84" cy="34" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Window Title -->
  <text x="440" y="38" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500">
    bash — Modern C++ Integration: namespace nur (C++11+)
  </text>

  <!-- Terminal Content -->
  <g class="term-text" transform="translate(45, 80)">
    <!-- Code Preview -->
    <g class="anim-code">
      <text x="0" y="0">
        <tspan class="prompt">❯ </tspan>
        <tspan class="cmd">cat demo_cpp.cpp</tspan>
      </text>
      <text x="0" y="24">
        <tspan class="keyword">#include </tspan><tspan class="str">"nur.h"</tspan>
        <tspan class="comment">  /* Active in any C++11+ translation unit */</tspan>
      </text>
      <text x="0" y="46">
        <tspan class="type">nur::Result_i32</tspan> <tspan class="func">get_port</tspan>() { <tspan class="keyword">return</tspan> <tspan class="type">nur</tspan>::<tspan class="func">ok</tspan>(<tspan class="metric">8080</tspan>); } <tspan class="comment">// Auto-deduced Result_i32</tspan>
      </text>
      <text x="0" y="68">
        <tspan class="type">int</tspan> <tspan class="func">main</tspan>() { <tspan class="type">int</tspan> p = <tspan class="type">nur</tspan>::<tspan class="func">unwrap_or</tspan>(<tspan class="func">get_port</tspan>(), <tspan class="metric">3000</tspan>); <tspan class="func">printf</tspan>(<tspan class="str">"Port: %d\n"</tspan>, p); <tspan class="keyword">return</tspan> <tspan class="metric">0</tspan>; }
      </text>
    </g>

    <!-- Compile -->
    <g class="anim-cmd2" transform="translate(0, 94)">
      <text x="0" y="0">
        <tspan class="prompt">❯ </tspan>
        <tspan class="cmd">g++ -std=c++11 -Wall -Wextra demo_cpp.cpp -Iinclude -o demo_cpp</tspan>
      </text>
    </g>

    <g class="anim-compile" transform="translate(0, 118)">
      <text x="0" y="0">
        <tspan class="success">✓ C++11 Clean:</tspan>
        <tspan fill="#8b949e"> Zero warnings, zero macros required, 100% type-safe</tspan>
      </text>
    </g>

    <!-- Run -->
    <g class="anim-cmd3" transform="translate(0, 148)">
      <text x="0" y="0">
        <tspan class="prompt">❯ </tspan>
        <tspan class="cmd">./demo_cpp</tspan>
      </text>
    </g>

    <!-- Exec Output -->
    <g class="anim-exec" transform="translate(0, 174)">
      <rect x="0" y="-14" width="70" height="20" rx="4" fill="#238636" opacity="0.9"/>
      <text x="35" y="0" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="11.5">SUCCESS</text>
      <text x="82" y="0" fill="#f0f6fc">
        Port: <tspan class="metric">8080</tspan>
        <tspan fill="#8b949e">  │  Namespace: </tspan><tspan fill="#79c0ff">nur::</tspan>
        <tspan fill="#8b949e">  │  Macros used: </tspan><tspan class="metric">0</tspan>
      </text>

      <rect x="0" y="14" width="70" height="20" rx="4" fill="#8957e5" opacity="0.9"/>
      <text x="35" y="28" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="11.5">MODERN</text>
      <text x="82" y="28" fill="#f0f6fc">
        Idiomatic C++: <tspan fill="#8b949e">Use nur::is_ok(), nur::value(), nur::sqrt(), nur::strlen()</tspan>
      </text>

      <text x="0" y="60">
        <tspan class="prompt">❯ </tspan>
        <rect x="18" y="48" width="8" height="15" class="cursor"/>
      </text>
    </g>
  </g>
</svg>
