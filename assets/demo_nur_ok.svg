<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-ok" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <filter id="shadow-ok" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes typing-code-ok {
      0%, 100% { opacity: 0; }
      8%, 98% { opacity: 1; }
    }
    @keyframes typing-cmd2-ok {
      0%, 28% { opacity: 0; }
      32%, 98% { opacity: 1; }
    }
    @keyframes compile-output-ok {
      0%, 46% { opacity: 0; }
      48%, 98% { opacity: 1; }
    }
    @keyframes typing-cmd3-ok {
      0%, 56% { opacity: 0; }
      60%, 98% { opacity: 1; }
    }
    @keyframes exec-output-ok {
      0%, 70% { opacity: 0; }
      72%, 98% { opacity: 1; }
    }
    @keyframes cursor-blink-ok {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }

    .term-text {
      font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace;
      font-size: 13.5px;
      line-height: 22px;
    }
    .prompt { fill: #58a6ff; font-weight: bold; }
    .cmd { fill: #f0f6fc; }
    .keyword { fill: #ff7b72; font-weight: bold; }
    .type { fill: #ffa657; }
    .func { fill: #d2a8ff; }
    .str { fill: #a5d6ff; }
    .comment { fill: #8b949e; font-style: italic; }
    .success { fill: #3fb950; font-weight: bold; }
    .metric { fill: #e3b341; font-weight: bold; }
    .cursor { fill: #58a6ff; animation: cursor-blink-ok 0.8s infinite; }

    .anim-code { animation: typing-code-ok 6s infinite; }
    .anim-cmd2 { animation: typing-cmd2-ok 6s infinite; }
    .anim-compile { animation: compile-output-ok 6s infinite; }
    .anim-cmd3 { animation: typing-cmd3-ok 6s infinite; }
    .anim-exec { animation: exec-output-ok 6s infinite; }
  </style>

  <!-- Container -->
  <rect x="20" y="16" width="840" height="318" rx="12" fill="url(#bg-grad-ok)" stroke="#30363d" stroke-width="1.5" filter="url(#shadow-ok)"/>

  <!-- Title Bar -->
  <path d="M 20 28 Q 20 16 32 16 L 848 16 Q 860 16 860 28 L 860 52 L 20 52 Z" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <line x1="20" y1="52" x2="860" y2="52" stroke="#30363d" stroke-width="1"/>

  <!-- Traffic Lights -->
  <circle cx="44" cy="34" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="64" cy="34" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="84" cy="34" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Window Title -->
  <text x="440" y="38" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500">
    bash — Explicit Result Constructors: NUR_OK(suffix, val) (C89/C99/C11/C23)
  </text>

  <!-- Terminal Content -->
  <g class="term-text" transform="translate(45, 80)">
    <!-- Code Preview -->
    <g class="anim-code">
      <text x="0" y="0">
        <tspan class="prompt">❯ </tspan>
        <tspan class="cmd">cat demo_nur_ok.c</tspan>
      </text>
      <text x="0" y="24">
        <tspan class="keyword">#include </tspan><tspan class="str">"nur.h"</tspan>
      </text>
      <text x="0" y="46">
        <tspan class="type">NurResult_i32</tspan> <tspan class="func">divide</tspan>(<tspan class="type">int</tspan> a, <tspan class="type">int</tspan> b) {
      </text>
      <text x="0" y="68">
        &#160;&#160;<tspan class="keyword">if</tspan> (b == <tspan class="metric">0</tspan>) <tspan class="keyword">return</tspan> <tspan class="func">NUR_ERR</tspan>(i32, <tspan class="func">NUR_ERROR</tspan>(NUR_E_INVALID_ARGUMENT, <tspan class="str">"div by 0"</tspan>));
      </text>
      <text x="0" y="90">
        &#160;&#160;<tspan class="keyword">return</tspan> <tspan class="func">NUR_OK</tspan>(i32, a / b); <tspan class="comment">/* Standard-portable 2-token constructor */</tspan>
      </text>
    </g>

    <!-- Compile -->
    <g class="anim-cmd2" transform="translate(0, 114)">
      <text x="0" y="0">
        <tspan class="prompt">❯ </tspan>
        <tspan class="cmd">gcc -std=c89 -Wall -Wextra -Wpedantic demo_nur_ok.c -o demo_nur_ok</tspan>
      </text>
    </g>

    <g class="anim-compile" transform="translate(0, 138)">
      <text x="0" y="0">
        <tspan class="success">✓ ISO C89 Pass:</tspan>
        <tspan fill="#8b949e"> 0 warnings under strict ANSI C89 / C90 pedantic mode</tspan>
      </text>
    </g>

    <!-- Run -->
    <g class="anim-cmd3" transform="translate(0, 168)">
      <text x="0" y="0">
        <tspan class="prompt">❯ </tspan>
        <tspan class="cmd">./demo_nur_ok</tspan>
      </text>
    </g>

    <!-- Exec Output -->
    <g class="anim-exec" transform="translate(0, 194)">
      <rect x="0" y="-14" width="70" height="20" rx="4" fill="#238636" opacity="0.9"/>
      <text x="35" y="0" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="11.5">SUCCESS</text>
      <text x="82" y="0" fill="#f0f6fc">
        10 / 2 = <tspan class="metric">5</tspan>
        <tspan fill="#8b949e">  │  Heap Allocated: </tspan><tspan class="metric">0 bytes</tspan>
        <tspan fill="#8b949e">  │  Memory Leak: </tspan><tspan class="success">None</tspan>
      </text>

      <rect x="0" y="14" width="70" height="20" rx="4" fill="#1f6feb" opacity="0.9"/>
      <text x="35" y="28" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="11.5">STANDARDS</text>
      <text x="82" y="28" fill="#f0f6fc">
        Runs unmodified on: <tspan fill="#79c0ff">C89</tspan>, <tspan fill="#79c0ff">C99</tspan>, <tspan fill="#79c0ff">C11</tspan>, <tspan fill="#79c0ff">C17</tspan>, <tspan fill="#79c0ff">C23</tspan>, and <tspan fill="#79c0ff">C++11</tspan>
      </text>

      <text x="0" y="60">
        <tspan class="prompt">❯ </tspan>
        <rect x="18" y="48" width="8" height="15" class="cursor"/>
      </text>
    </g>
  </g>
</svg>
