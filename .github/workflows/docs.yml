name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/nur.h'
      - 'README.md'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/nur.h'
      - 'README.md'

jobs:
  validate-links:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for documentation files
        id: check_docs
        run: |
          docs_exist="false"
          readme_exist="false"
          
          if [ -d "docs" ] && [ -n "$(find docs -name '*.md' -o -name '*.html' -o -name '*.rst' 2>/dev/null)" ]; then
            docs_exist="true"
          fi
          
          if [ -f "README.md" ]; then
            readme_exist="true"
          fi
          
          echo "docs_exist=$docs_exist" >> $GITHUB_OUTPUT
          echo "readme_exist=$readme_exist" >> $GITHUB_OUTPUT
      
      - name: Validate links in documentation
        if: steps.check_docs.outputs.docs_exist == 'true' || steps.check_docs.outputs.readme_exist == 'true'
        uses: lycheeverse/lychee-action@v1
        with:
          # Check all markdown and HTML files in docs/ and README.md
          args: |
            --verbose
            --no-progress
            --exclude-private
            --exclude-mail
            --exclude 'localhost'
            --exclude '127.0.0.1'
            --exclude 'file://'
            --max-concurrency 4
            README.md docs/
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Skip link validation (no docs found)
        if: steps.check_docs.outputs.docs_exist == 'false' && steps.check_docs.outputs.readme_exist == 'false'
        run: echo "No documentation files found to validate"

  spellcheck:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check for documentation files
        id: check_docs
        run: |
          files_to_check=""
          
          if [ -f "README.md" ]; then
            files_to_check="README.md"
          fi
          
          if [ -d "docs" ]; then
            doc_files=$(find docs -name '*.md' -o -name '*.rst' -o -name '*.txt' 2>/dev/null || true)
            if [ -n "$doc_files" ]; then
              files_to_check="$files_to_check $doc_files"
            fi
          fi
          
          if [ -n "$files_to_check" ]; then
            echo "files_exist=true" >> $GITHUB_OUTPUT
            echo "files=$files_to_check" >> $GITHUB_OUTPUT
          else
            echo "files_exist=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create custom wordlist
        if: steps.check_docs.outputs.files_exist == 'true'
        run: |
          cat > .cspell.json << 'EOF'
          {
            "version": "0.2",
            "language": "en",
            "words": [
              "nur",
              "NurResult",
              "NurOption",
              "NUR_TRY",
              "NUR_OK",
              "NUR_ERR",
              "NUR_UNWRAP",
              "NUR_EXPECT",
              "NUR_CHECK",
              "NUR_SOME",
              "NUR_NONE",
              "nodiscard",
              "errno",
              "stdbool",
              "stdint",
              "stddef",
              "malloc",
              "realloc",
              "calloc",
              "GCC",
              "Clang",
              "MSVC",
              "C99",
              "C11",
              "C17",
              "C23",
              "STDC",
              "typeof",
              "alignof",
              "alignas",
              "noreturn",
              "inline",
              "const",
              "restrict",
              "volatile",
              "extern",
              "static",
              "auto",
              "register",
              "typedef",
              "struct",
              "union",
              "enum",
              "goto",
              "sizeof",
              "cppcheck",
              "valgrind",
              "github",
              "makefile",
              "cmake",
              "meson",
              "autotools",
              "pkgconfig",
              "libc",
              "glibc",
              "musl",
              "mingw",
              "cygwin",
              "POSIX",
              "ANSI",
              "ISO",
              "API",
              "ABI",
              "GPL",
              "MIT",
              "BSD",
              "preprocessor",
              "namespace",
              "fallthrough",
              "unreachable",
              "nullptr",
              "filesystem",
              "stdout",
              "stderr",
              "stdin",
              "printf",
              "sprintf",
              "fprintf",
              "snprintf",
              "memcpy",
              "memset",
              "memcmp",
              "strlen",
              "strcmp",
              "strcpy",
              "strcat",
              "strstr"
            ],
            "ignorePaths": [
              "node_modules/**",
              ".git/**",
              "**/*.min.*",
              "**/*.map"
            ],
            "ignoreRegExpList": [
              "/\\b[A-Z_]{2,}\\b/g",
              "/\\b0x[0-9a-fA-F]+\\b/g",
              "/\\b\\d+\\.\\d+\\.\\d+\\b/g"
            ]
          }
          EOF
      
      - name: Run spell check
        if: steps.check_docs.outputs.files_exist == 'true'
        uses: streetsidesoftware/cspell-action@v6
        with:
          config: '.cspell.json'
          files: ${{ steps.check_docs.outputs.files }}
          inline: warning
          strict: true
      
      - name: Skip spell check (no docs found)
        if: steps.check_docs.outputs.files_exist == 'false'
        run: echo "No documentation files found to spell check"