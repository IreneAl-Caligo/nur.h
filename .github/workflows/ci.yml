name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CFLAGS: -Wall -Wextra -Wpedantic

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc-9, gcc-11, gcc-13, clang-12, clang-16]
        standard: [c99, c11, c17]
        exclude:
          # GCC 9 doesn't support C17 fully
          - compiler: gcc-9
            standard: c17
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install GCC compilers
        if: startsWith(matrix.compiler, 'gcc')
        run: |
          case "${{ matrix.compiler }}" in
            gcc-9)
              sudo apt-get update
              sudo apt-get install -y gcc-9
              echo "CC=gcc-9" >> $GITHUB_ENV
              ;;
            gcc-11)
              sudo apt-get update
              sudo apt-get install -y gcc-11
              echo "CC=gcc-11" >> $GITHUB_ENV
              ;;
            gcc-13)
              sudo apt-get update
              sudo apt-get install -y gcc-13
              echo "CC=gcc-13" >> $GITHUB_ENV
              ;;
          esac
      
      - name: Install Clang compilers
        if: startsWith(matrix.compiler, 'clang')
        run: |
          case "${{ matrix.compiler }}" in
            clang-12)
              sudo apt-get update
              sudo apt-get install -y clang-12
              echo "CC=clang-12" >> $GITHUB_ENV
              ;;
            clang-16)
              wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
              echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-16 main" | sudo tee /etc/apt/sources.list.d/llvm.list
              sudo apt-get update
              sudo apt-get install -y clang-16
              echo "CC=clang-16" >> $GITHUB_ENV
              ;;
          esac
      
      - name: Install cppcheck for static analysis
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
      
      - name: Run tests
        run: |
          export CFLAGS="${CFLAGS} -std=${{ matrix.standard }}"
          make CC="${CC}" test-all
      
      - name: Run static analysis
        if: matrix.compiler == 'gcc-13' && matrix.standard == 'c11'
        run: make analyze

  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        standard: [c11, c17]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install MinGW
        run: |
          choco install mingw
          echo "CC=gcc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      
      - name: Run tests
        shell: bash
        run: |
          export PATH="/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin:$PATH"
          export CFLAGS="${CFLAGS} -std=${{ matrix.standard }}"
          make CC="gcc" test-all

  test-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run tests
        run: |
          export CC=clang
          make test-all

  syntax-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        standard: [c99, c11, c17, c23]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install GCC 13 (for C23 support)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13
      
      - name: Syntax check
        run: |
          if [ "${{ matrix.standard }}" = "c23" ]; then
            # C23 might not be fully supported, allow failure
            gcc-13 -std=${{ matrix.standard }} -Wall -Wextra -Wpedantic -fsyntax-only src/nur.h || echo "C23 syntax check failed (expected on some compilers)"
          else
            gcc-13 -std=${{ matrix.standard }} -Wall -Wextra -Wpedantic -fsyntax-only src/nur.h
          fi

  examples-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check if examples directory exists
        id: check_examples
        run: |
          if [ -d "examples" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Build examples
        if: steps.check_examples.outputs.exists == 'true'
        run: |
          find examples -name '*.c' -exec gcc -std=c11 -Wall -Wextra -Wpedantic -I./src -o /dev/null {} \;
      
      - name: Skip examples (directory not found)
        if: steps.check_examples.outputs.exists == 'false'
        run: echo "No examples directory found, skipping examples build"

  all-checks:
    runs-on: ubuntu-latest
    needs: [test-linux, test-windows, test-macos, syntax-check, examples-build]
    if: always()
    
    steps:
      - name: Check all jobs status
        run: |
          if [ "${{ needs.test-linux.result }}" != "success" ] || \
             [ "${{ needs.test-windows.result }}" != "success" ] || \
             [ "${{ needs.test-macos.result }}" != "success" ] || \
             [ "${{ needs.syntax-check.result }}" != "success" ] || \
             [ "${{ needs.examples-build.result }}" != "success" ]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All checks passed!"